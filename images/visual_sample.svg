<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#6b5cff"/>
      <stop offset="60%" stop-color="#3ddbd9"/>
      <stop offset="100%" stop-color="#15c27d"/>
    </linearGradient>
    <filter id="f1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="b" />
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="30%" r="80%">
      <stop offset="60%" stop-color="#00000000"/>
      <stop offset="100%" stop-color="#000a0f"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1600" height="1000" fill="#050507"/>
  <rect width="1600" height="1000" fill="url(#vignette)"/>

  <!-- glowing abstract blobs -->
  <g filter="url(#f1)">
    <circle cx="420" cy="380" r="220" fill="url(#g1)" opacity="0.18"/>
    <circle cx="950" cy="500" r="300" fill="#7b6bff" opacity="0.12"/>
    <circle cx="1200" cy="300" r="160" fill="#2fe0d4" opacity="0.14"/>
  </g>

  <!-- pixel-ish shape -->
  <g transform="translate(620,380) scale(1) rotate(-12)">
    <!-- create a pixelated diamond -->
    <rect x="-140" y="-140" width="60" height="60" rx="6" fill="#ffffff22"/>
    <rect x="-80" y="-140" width="60" height="60" rx="6" fill="#ffffff15"/>
    <rect x="-20" y="-140" width="60" height="60" rx="6" fill="#ffffff12"/>

    <rect x="-140" y="-80" width="60" height="60" rx="6" fill="#ffffff12"/>
    <rect x="-80" y="-80" width="60" height="60" rx="6" fill="#3ddbd9"/>
    <rect x="-20" y="-80" width="60" height="60" rx="6" fill="#6b5cff"/>

    <rect x="-140" y="-20" width="60" height="60" rx="6" fill="#ffffff12"/>
    <rect x="-80" y="-20" width="60" height="60" rx="6" fill="#6b5cff"/>
    <rect x="-20" y="-20" width="60" height="60" rx="6" fill="#15c27d"/>
  </g>

  <!-- faint stars -->
  <g fill="#ffffff0f">
    <circle cx="200" cy="120" r="1.6"/>
    <circle cx="300" cy="210" r="1.2"/>
    <circle cx="880" cy="60" r="1.6"/>
    <circle cx="1400" cy="140" r="1.3"/>
    <circle cx="1100" cy="860" r="1.4"/>
    <circle cx="420" cy="820" r="1.2"/>
  </g>

  <!-- subtle foreground gradient -->
  <rect x="0" y="760" width="1600" height="240" fill="url(#vignette)" opacity="0.6"/>

  <!-- optional watermark text -->
  <g fill="#ffffff22" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="18" transform="translate(32,968)">
    <text x="0" y="-6">x_komandos_x • visuals</text>
  </g>
</svg>
